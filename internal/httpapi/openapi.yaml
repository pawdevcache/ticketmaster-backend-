openapi: 3.0.3

info:
  title: Ticketmaster API
  version: "1.0.0"
  description: |
    Event discovery and ticketing API.

    ## Authentication

    `POST /api/login` (or `/api/admin/login`) returns a token. Send it as
    `Authorization: Bearer <token>` on any endpoint marked with a padlock.
    Tokens expire 24 hours after they are issued.

    Endpoints fall into three tiers:

    * **public** — discovery reads, registration, login, password recovery
    * **user** — any signed-in account; a user only ever sees their own bookings
    * **admin** — an account with `role: admin`

    Every write to a discovery resource is admin-only, including the create
    routes that share a path with a public read.

    ## Partial updates

    `PUT` and `PATCH` behave identically: the body is decoded over the stored
    record, so send only the fields that change. Server-owned fields (`id`,
    and `ticketsSold` on an event) are ignored if present in a body.

servers:
  - url: http://localhost:8080
    description: Local development
  - url: /
    description: Same origin as this page

tags:
  - name: Service
    description: Health and service metadata
  - name: Discovery
    description: Public catalogue reads
  - name: Discovery (admin)
    description: Catalogue writes — admin token required
  - name: Auth
    description: Registration, login and password recovery
  - name: Bookings
    description: A signed-in user's own bookings
  - name: Admin — accounts
    description: User administration
  - name: Admin — bookings
    description: Bookings across all users

security: []

paths:
  /:
    get:
      tags: [Service]
      summary: Service metadata and endpoint index
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: Ticketmaster API }
                  status: { type: string, example: running }
                  endpoints:
                    type: object
                    properties:
                      public: { type: array, items: { type: string } }
                      user: { type: array, items: { type: string } }
                      admin: { type: array, items: { type: string } }

  /health:
    get:
      tags: [Service]
      summary: Liveness and database connectivity
      description: |
        Always returns 200 while the process is serving. A database that is
        unreachable is reported as `degraded` rather than a failure status, so
        a container does not restart-loop through a brief database outage.
      responses:
        "200":
          description: Process is up; check `status` for database state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  db: { type: string, enum: [connected, disconnected] }
                  error: { type: string, description: Present only when degraded }
              examples:
                healthy:
                  value: { status: ok, db: connected }
                degraded:
                  value: { status: degraded, db: disconnected, error: "mongo unreachable at ..." }

  /docs:
    get:
      tags: [Service]
      summary: Interactive API reference (this page)
      description: Swagger UI. Loads its assets from a CDN, so it needs internet access in the browser.
      responses:
        "200":
          description: HTML documentation page
          content:
            text/html:
              schema: { type: string }

  /openapi.yaml:
    get:
      tags: [Service]
      summary: This document
      responses:
        "200":
          description: The OpenAPI specification
          content:
            application/yaml:
              schema: { type: string }

  # ------------------------------------------------------------------ events

  /discovery/v2/events:
    get:
      tags: [Discovery]
      summary: Search events
      parameters:
        - { name: keyword, in: query, schema: { type: string }, description: Case-insensitive substring of the event name }
        - { name: city, in: query, schema: { type: string }, description: Matches the city of the event's venue }
        - { name: classificationId, in: query, schema: { type: string } }
        - name: startDateTime
          in: query
          schema: { type: string, format: date-time }
          description: Only events on or after this RFC3339 timestamp. Ignored if unparseable.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedEnvelope"
                  - type: object
                    properties:
                      _embedded:
                        type: object
                        properties:
                          events:
                            type: array
                            items: { $ref: "#/components/schemas/Event" }
    post:
      tags: [Discovery (admin)]
      summary: Create an event
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /discovery/v2/events/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Discovery]
      summary: Get one event
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Discovery (admin)]
      summary: Update an event (partial)
      description: |
        Send only the fields to change. `ticketsSold` is owned by the booking
        flow and is ignored if supplied. Lowering `ticketsTotal` below the
        number already sold is rejected with 400.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Discovery (admin)]
      summary: Update an event (identical to PUT)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Discovery (admin)]
      summary: Delete an event
      description: Refused with 409 while the event has confirmed bookings.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InUse" }

  # ------------------------------------------------------------------ venues

  /discovery/v2/venues:
    get:
      tags: [Discovery]
      summary: Search venues
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
