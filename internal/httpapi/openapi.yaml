    put:
      tags: [Discovery (admin)]
      summary: Update a venue (partial)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueInput" }
      responses:
        "200":
          description: Updated venue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Discovery (admin)]
      summary: Update a venue (identical to PUT)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueInput" }
      responses:
        "200":
          description: Updated venue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Discovery (admin)]
      summary: Delete a venue
      description: Refused with 409 while any event is scheduled there.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InUse" }

  # ------------------------------------------------------------- attractions

  /discovery/v2/attractions:
    get:
      tags: [Discovery]
      summary: Search attractions
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged attractions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedEnvelope"
                  - type: object
                    properties:
                      _embedded:
                        type: object
                        properties:
                          attractions:
                            type: array
                            items: { $ref: "#/components/schemas/Attraction" }
    post:
      tags: [Discovery (admin)]
      summary: Create an attraction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttractionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attraction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /discovery/v2/attractions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Discovery]
      summary: Get one attraction
      responses:
        "200":
          description: The attraction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attraction" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Discovery (admin)]
      summary: Update an attraction (partial)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttractionInput" }
      responses:
        "200":
          description: Updated attraction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attraction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Discovery (admin)]
      summary: Update an attraction (identical to PUT)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttractionInput" }
      responses:
        "200":
          description: Updated attraction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attraction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Discovery (admin)]
      summary: Delete an attraction
      description: Refused with 409 while any event still lists it.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InUse" }

  # ---------------------------------------------------------- classifications

  /discovery/v2/classifications:
    get:
      tags: [Discovery]
      summary: List classifications
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged classifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedEnvelope"
                  - type: object
                    properties:
                      _embedded:
                        type: object
                        properties:
                          classifications:
                            type: array
                            items: { $ref: "#/components/schemas/Classification" }
    post:
      tags: [Discovery (admin)]
      summary: Create a classification
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Classification" }
        "400":
          description: segment is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /discovery/v2/classifications/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Discovery]
      summary: Get one classification
      responses:
        "200":
          description: The classification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Classification" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Discovery (admin)]
      summary: Update a classification (partial)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationInput" }
      responses:
        "200":
          description: Updated classification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Classification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Discovery (admin)]
      summary: Update a classification (identical to PUT)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationInput" }
      responses:
        "200":
          description: Updated classification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Classification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Discovery (admin)]
      summary: Delete a classification
      description: Refused with 409 while events or attractions still use it.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InUse" }

  # -------------------------------------------------------------------- auth

  /api/register:
    post:
      tags: [Auth]
      summary: Register a user account
      description: |
        `role` in the body is ignored — an account created here is always a
        normal user. Admin accounts come from `/api/admin/register`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Ann Smith }
                email: { type: string, format: email, example: ann@example.com }
                password: { type: string, format: password, example: pw123456 }
      responses:
        "201":
          description: Account created. The password hash is never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: name, email and password are required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/login:
    post:
      tags: [Auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/logout:
    post:
      tags: [Auth]
      summary: Sign out
      description: |
        Revokes the token the request was made with, so it stops working
        immediately rather than lingering until it expires. Only the calling
        session ends — the same account signed in on another device stays
        signed in.

        Not rate-limited: ending your own session must always be possible.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/me:
    get:
      tags: [Auth]
      summary: The signed-in account
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Auth]
      summary: Edit your own profile
      description: |
        Changes name, email and password. Send only what changes.

        `currentPassword` is required to change the email or the password. A
        bearer token alone is not enough: tokens last a day and can be stolen,
        and either field leads to permanent control of the account — the email
        because password recovery goes there.

        A new password retires every other session, in case one of them is the
        reason for the change. The session making the request stays valid.

        Role cannot be changed here, so no body can promote its sender.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: currentPassword missing or wrong
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: That email belongs to another account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [Auth]
      summary: Edit your own profile (identical to PUT)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: currentPassword missing or wrong
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: That email belongs to another account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password-reset token
      description: |
        Always answers 200 with the same message whether or not the address has
        an account, so the endpoint cannot be used to discover who is
        registered. Admin accounts are excluded from the flow.

        No mail service is configured, so the token is written to the server
        log. Outside production (`ENV` set to development/dev/local/test) it is
        also returned in the response as `resetToken` to make local testing
        workable — note that this does reveal whether the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Request accepted (identical whether or not the account exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  resetToken:
                    type: string
                    description: Non-production only
                  note: { type: string }
        "400":
          description: email is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password using a reset token
      description: |
        The token is single-use and expires one hour after it was issued.
        Requesting a new one invalidates any earlier token. A successful reset
        also revokes every existing login session for that account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, description: The token from /api/forgot-password }
                newPassword: { type: string, format: password, minLength: 6 }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "password updated, please sign in again" }
        "400":
          description: Missing fields, password too short, or an invalid/used/expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------------------------ admin: auth

  /api/admin/register:
    post:
      tags: [Admin — accounts]
      summary: Create an admin account
      description: |
        Requires the shared secret from `ADMIN_REGISTRATION_KEY`, sent either as
        the `X-Admin-Key` header or as `adminKey` in the body. Registration is
        disabled (503) while that variable is unset.
      parameters:
        - name: X-Admin-Key
          in: header
          schema: { type: string }
          description: The registration secret. Alternatively send `adminKey` in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                adminKey: { type: string, description: Used when the header is absent }
      responses:
        "201":
          description: Admin account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Invalid admin key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: ADMIN_REGISTRATION_KEY is not set, so registration is disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/admin/login:
    post:
      tags: [Admin — accounts]
      summary: Sign in as an admin
      description: |
        A non-admin account gets the same 401 as a wrong password, so this
        endpoint does not reveal which emails belong to admins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          description: Invalid credentials, or the account is not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/admin/me:
    get:
      tags: [Admin — accounts]
      summary: The signed-in admin
      description: Useful for validating a stored token on page load.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The admin account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------- admin: analytics

  /api/admin/analytics:
    get:
      tags: [Admin — bookings]
      summary: Dashboard figures
      description: |
        Both dashboard series in one response: revenue per event and tickets
        sold per category. Aggregated by the database, so the client does not
        need to read the booking collection to chart it.

        Confirmed bookings only — a cancelled booking has had its seats
        released, so counting it would overstate revenue and demand.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: topEvents
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
          description: How many events to return, highest revenue first. Capped at 50.
      responses:
        "200":
          description: Dashboard series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -------------------------------------------------------- admin: check-in

  /api/admin/tickets/check-in:
    post:
      tags: [Admin — bookings]
      summary: Admit a scanned ticket
      description: |
        Consumes the `ticketCode` a ticket's QR encodes and admits its holder.

        The first scan succeeds and stamps `checkedInAt`; every later scan of
        the same ticket is refused as `already_used`, so one ticket admits one
        time. The stamp is applied with a single conditional update, so two
        doors scanning simultaneously cannot both admit.

        The code travels in the body rather than the path: it is the ticket's
        only credential, and URLs end up in access logs and browser history.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The ticketCode from the booking, as carried by the QR.
                  example: 9f3c1d7a5b2e480c9a6f1e2d3c4b5a60
      responses:
        "200":
          description: Admitted — first scan of a valid ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckIn" }
              example:
                result: valid
                message: admitted
        "400":
          description: No code supplied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No ticket matches that code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckIn" }
              example:
                result: not_found
                message: no ticket matches that code
        "409":
          description: Already scanned, or the booking was cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckIn" }
              example:
                result: already_used
                message: this ticket has already been scanned

  /api/admin/tickets/check-in/bulk:
    post:
      tags: [Admin — bookings]
      summary: Admit a batch of scans queued while offline
      description: |
        For a gate with poor connectivity: queue scans locally, then flush them
        in one request when the network returns.

        Each scan carries its own `scannedAt`, so a ticket records the moment it
        went through the door rather than the moment the network came back.
        Omit it and the server uses the time it received the batch.

        Always 200. Outcomes are per scan, using the same `result` values as a
        single check-in plus `error` for a scan the server could not process —
        one refused ticket in a batch of three hundred is a fact to report, not
        a failed request. Re-flushing a batch is safe: an already-admitted
        ticket comes back as `already_used`.

        At most 1000 scans per batch.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scans]
              properties:
                scans:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [code]
                    properties:
                      code: { type: string }
                      scannedAt: { type: string, format: date-time }
            example:
              scans:
                - { code: 9f3c1d7a5b2e480c9a6f1e2d3c4b5a60, scannedAt: "2026-09-01T19:12:04Z" }
                - { code: 01242ba4b8cb45dac0ec07929cdeda41, scannedAt: "2026-09-01T19:12:31Z" }
      responses:
        "200":
          description: Per-scan outcomes and a tally
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        result: { type: string, enum: [valid, already_used, cancelled, unpaid, not_found, error] }
                        message: { type: string }
                        bookingId: { type: string }
                  summary:
                    type: object
                    additionalProperties: { type: integer }
                    description: Count per result value.
              example:
                summary: { valid: 2, already_used: 1 }
        "400":
          description: No scans supplied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: More than 1000 scans in one batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/door:
    get:
      tags: [Admin — bookings]
      summary: Door dashboard — sold versus admitted
      description: |
        How many tickets each event has sold and how many have been scanned in,
        busiest first. Computed per request, so it can be polled during a
        performance.

        Admitted counts a booking's whole quantity, because one scan admits the
        whole booking. Only confirmed bookings count: an unpaid hold has sold
        nothing and a cancelled one returned its seats.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: eventId, in: query, schema: { type: string }, description: Limit to one event }
      responses:
        "200":
          description: One row per event with sales
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        eventId: { type: string }
                        name: { type: string }
                        capacity: { type: integer, description: The event's ticketsTotal }
                        sold: { type: integer }
                        admitted: { type: integer }
              example:
                events:
                  - { eventId: 6a71…, name: Rock Night, capacity: 500, sold: 320, admitted: 287 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ----------------------------------------------------------- admin: users

  /api/admin/users:
    get:
      tags: [Admin — accounts]
      summary: List accounts
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string }, description: Substring of name or email }
        - { name: role, in: query, schema: { type: string, enum: [user, admin] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged accounts, without password hashes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedEnvelope"
                  - type: object
                    properties:
                      _embedded:
                        type: object
                        properties:
                          users:
                            type: array
                            items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/users/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Admin — accounts]
      summary: Get one account
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Admin — accounts]
      summary: Update an account (partial)
      description: |
        A `password` in the body is plaintext and is hashed before storage;
        omit it to leave the current password alone. An admin cannot remove
        their own admin role.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Missing email, or an attempt to self-demote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Email already registered to another account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [Admin — accounts]
      summary: Update an account (identical to PUT)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Email already registered to another account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Admin — accounts]
      summary: Delete an account
      description: |
        Refused with 409 while the user holds confirmed bookings. An admin
        cannot delete their own account (400).
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: "Deleted, along with that account's login tokens" }
        "400":
          description: Attempt to delete your own account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InUse" }

  # -------------------------------------------------------- admin: bookings

  /api/admin/bookings:
    get:
      tags: [Admin — bookings]
      summary: List bookings across all users
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: query, schema: { type: string } }
        - { name: eventId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [confirmed, cancelled] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged bookings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedEnvelope"
                  - type: object
                    properties:
                      _embedded:
                        type: object
                        properties:
                          bookings:
                            type: array
                            items: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/bookings/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Admin — bookings]
      summary: Get any booking
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin — bookings]
      summary: Delete a booking outright
      description: |
        Erases the record. A still-confirmed booking releases its tickets back
        to the event first, so an event is never left overcounted. Prefer
        `/cancel` when the history matters.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/bookings/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Admin — bookings]
      summary: Cancel any user's booking
      description: |
        Sets the status to `cancelled` and returns the tickets to the event,
        keeping the record for audit. Cancelling an already-cancelled booking
        is a safe no-op.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The cancelled booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------- user bookings

  /api/bookings:
    get:
      tags: [Bookings]
      summary: List your own bookings
      description: Returns a plain array, not the paged envelope used elsewhere.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Every booking belonging to the signed-in user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Bookings]
      summary: Book tickets
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, quantity]
              properties:
                eventId: { type: string }
                quantity: { type: integer, minimum: 1, example: 2 }
      responses:
        "201":
          description: Booking confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Event not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Event is not on sale, or not enough tickets remain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/bookings/{id}/pay:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Bookings]
      summary: Confirm payment for a held booking
      description: |
        Turns a `pending` booking into a `confirmed` one, once the payment
        provider confirms the charge actually succeeded.

        The server asks the provider directly — the client only says which
        booking it is paying for. Trusting a client that claims "paid" would
        hand out tickets for free.

        Only meaningful when payments are enabled; answers 404 otherwise.
        Calling it twice is safe: an already-paid booking returns 200.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Paid, or already paid
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: "#/components/schemas/Booking" }
                  status: { type: string, enum: [paid, "already paid"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: The charge has not completed at the provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such booking, or payments are not enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The hold expired, or the booking is not awaiting payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The payment provider could not be reached; the hold stands, so retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/bookings/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Bookings]
      summary: Get one of your bookings
      description: Another user's booking returns 404, not 403.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Bookings]
      summary: Cancel one of your bookings
      description: |
        Cancels rather than deletes: the record is kept with `status:
        cancelled` and the tickets go back to the event. Returns the booking,
        not 204.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The cancelled booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A token from `/api/login` or `/api/admin/login`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
      description: Zero-based page number.
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Page size. Values above 100 are capped at 100.

  responses:
    BadRequest:
      description: Malformed or invalid request body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, expired or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unauthorized }
    Forbidden:
      description: Authenticated, but the account is not an admin
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: admin access required }
    NotFound:
      description: No such record
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InUse:
      description: Still referenced by other records, so it cannot be deleted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: |
        Rate limit exceeded for this endpoint and caller. The `Retry-After`
        header gives the number of seconds to wait.
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "too many attempts, try again in 42 seconds" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      example: { error: event not found }

    PagedEnvelope:
      type: object
      properties:
        _embedded:
          type: object
          description: Holds a single array keyed by resource name.
        page:
          type: object
          properties:
            size: { type: integer, example: 20 }
            totalElements: { type: integer, example: 42 }
            totalPages: { type: integer, example: 3 }
            number: { type: integer, description: Zero-based page number, example: 0 }

    Classification:
      type: object
      properties:
        id: { type: string, readOnly: true }
        segment: { type: string, example: Music }
        genre: { type: string, example: Rock }

    ClassificationInput:
      type: object
      properties:
        segment: { type: string, example: Music }
        genre: { type: string, example: Rock }

    Attraction:
      type: object
      properties:
        id: { type: string, readOnly: true }
        name: { type: string, example: The Band }
        type: { type: string, example: performer }
        classificationId: { type: string }

    AttractionInput:
      type: object
      properties:
        name: { type: string }
        type: { type: string, example: performer }
        classificationId: { type: string }

    Venue:
      type: object
      properties:
        id: { type: string, readOnly: true }
        name: { type: string, example: National Arena }
        city: { type: string, example: Colombo }
        state: { type: string }
        country: { type: string }
        address: { type: string }
        capacity: { type: integer, example: 5000 }

    VenueInput:
      type: object
      properties:
        name: { type: string }
        city: { type: string }
        state: { type: string }
        country: { type: string }
        address: { type: string }
        capacity: { type: integer }

    Event:
      type: object
      properties:
        id: { type: string, readOnly: true }
        name: { type: string, example: Rock Night }
        date: { type: string, format: date-time }
        venueId: { type: string }
        attractionIds:
          type: array
          nullable: true
          items: { type: string }
        classificationId: { type: string }
        priceMin: { type: number, format: double, example: 50 }
        priceMax: { type: number, format: double, example: 120 }
        ticketsTotal: { type: integer, example: 500 }
        ticketsSold:
          type: integer
          readOnly: true
          description: Maintained by the booking flow; ignored in request bodies.
        status:
          type: string
          enum: [onsale, offsale, cancelled]
          description: Defaults to onsale when an event is created.
        description: { type: string }
        title: { type: string }

    EventInput:
      type: object
      properties:
        name: { type: string, example: Rock Night }
        date:
          type: string
          description: "`YYYY-MM-DD` or a full RFC3339 timestamp."
          example: "2026-09-01"
        venueId: { type: string }
        attractionIds:
          type: array
          items: { type: string }
        classificationId: { type: string }
        priceMin: { type: number, format: double, example: 50 }
        priceMax: { type: number, format: double, example: 120 }
        ticketsTotal: { type: integer, example: 500 }
        status: { type: string, enum: [onsale, offsale, cancelled] }
        description: { type: string }
        title: { type: string }

    User:
      type: object
      properties:
        id: { type: string, readOnly: true }
        name: { type: string, example: Ann Smith }
        email: { type: string, format: email }
        role:
          type: string
          enum: [user, admin]
          description: Set by the server from the endpoint used; ignored in request bodies on /api/register.

    ProfileInput:
      type: object
      description: Send only the fields that change.
      properties:
        name: { type: string }
        email: { type: string, format: email }
        newPassword: { type: string, format: password, minLength: 6 }
        currentPassword:
          type: string
          format: password
          description: Required when changing email or password.

    UserInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        password:
          type: string
          format: password
          description: Plaintext; hashed before storage. Omit to keep the current password.

    Booking:
      type: object
      properties:
        id: { type: string, readOnly: true }
        userId: { type: string, readOnly: true }
        eventId: { type: string }
        quantity: { type: integer, example: 2 }
        total: { type: number, format: double, description: quantity × the event's priceMin }
        status:
          type: string
          enum: [pending, confirmed, cancelled, expired]
          description: |
            pending and confirmed both withhold seats from the event;
            cancelled and expired return them. A booking is only pending when
            payments are enabled.
        createdAt: { type: string, format: date-time, readOnly: true }
        ticketCode:
          type: string
          readOnly: true
          description: |
            What the ticket's QR encodes and what check-in consumes. Server
            generated and random — not derived from the id, which is an
            ObjectID and therefore partly guessable.
          example: 9f3c1d7a5b2e480c9a6f1e2d3c4b5a60
        checkedInAt:
          type: string
          format: date-time
          readOnly: true
          description: When the ticket was scanned at the door. Absent until then, and never cleared.
        holdExpiresAt:
          type: string
          format: date-time
          readOnly: true
          description: Deadline for paying a pending booking. Absent once it is no longer pending.
        paymentIntentId:
          type: string
          readOnly: true
          description: The charge at the payment provider, kept for reconciliation.
        paidAt: { type: string, format: date-time, readOnly: true }
        event:
          allOf:
            - $ref: "#/components/schemas/EventSummary"
          readOnly: true
          description: |
            Filled in on every read, so a ticket can be rendered without
            fetching the event separately. Absent if the event has since been
            deleted.

    EventSummary:
      type: object
      description: The slice of an event a ticket needs — what, when and where.
      properties:
        id: { type: string }
        name: { type: string, example: Rock Night }
        date: { type: string, format: date-time }
        status: { type: string, enum: [onsale, offsale, cancelled] }
        venueId: { type: string }
        venueName: { type: string, example: National Arena }
        venueAddress: { type: string, example: 1 Independence Square }
        venueCity: { type: string, example: Colombo }

    Analytics:
      type: object
      properties:
        revenueByEvent:
          type: array
          description: Highest revenue first, limited by topEvents.
          items:
            type: object
            properties:
              eventId: { type: string }
              name: { type: string, description: '"(deleted event)" if the event no longer exists' }
              revenue: { type: number, format: double }
              tickets: { type: integer }
              bookings: { type: integer }
        ticketsByCategory:
          type: array
          description: Most tickets first. Bookings with no reachable classification group under "Uncategorised".
          items:
            type: object
            properties:
              classificationId: { type: string }
              segment: { type: string, example: Music }
              genre: { type: string, example: Rock }
              tickets: { type: integer }
              revenue: { type: number, format: double }

    CheckIn:
      type: object
      properties:
        result:
          type: string
          enum: [valid, already_used, cancelled, unpaid, not_found]
          description: |
            Why the scan was accepted or refused. `already_used` is kept
            distinct from `not_found` so a door can tell a duplicated ticket
            from a double scan of a genuine one.
        message: { type: string, description: Wording a gate attendant can act on }
        booking:
          allOf:
            - $ref: "#/components/schemas/Booking"
          description: The ticket's booking, absent only when the code is unknown.

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@gmail.com }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: "Send as `Authorization: Bearer <token>`. Valid for 24 hours."
        user: { $ref: "#/components/schemas/User" }
